[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "api-qa-intelligence"
version = "1.22.0"
description = "Reads an OpenAPI or Swagger contract, writes and runs the API checks for you, and shows what failed and what was never tested."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "anyio>=4",
    "httpcore>=1.0",
    # Target connections are checked through the transport's connection pool, an httpx 0.x detail.
    "httpx>=0.27,<1",
    "python-multipart>=0.0.12",
    "PyYAML>=6.0",
    "uvicorn[standard]>=0.30",
]

[project.scripts]
api-qa = "app.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
# The Python package is backend/app; the frontend is not part of the Python distribution.
where = ["backend"]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint.isort]
known-first-party = ["app"]
