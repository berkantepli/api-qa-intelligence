name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check backend --select F,E9,I
      - name: Test
        run: pytest

  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Test
        run: npm test
      - name: Build
        run: npm run build

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: |
          pip install -e ".[dev]"
          cd frontend && npm ci && npx playwright install --with-deps chromium
      - name: Build
        run: npm run build
        working-directory: frontend
      - name: Test
        run: npm run test:e2e
        working-directory: frontend
        env:
          E2E_PYTHON: python
      - name: Keep the traces of failed tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: frontend/test-results

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -t api-qa-intelligence .
      - name: Start
        run: docker run -d --name api-qa -p 8001:8001 api-qa-intelligence
      - name: Smoke test
        run: |
          for i in $(seq 1 30); do curl -fsS http://localhost:8001/health && break; sleep 1; done
          curl -fsS http://localhost:8001/health | grep -q "\"version\":\"$(cat VERSION)\""
          curl -fsS http://localhost:8001/ | grep -q '<div id="root">'
          curl -fsS http://localhost:8001/api/v1/workspace | grep -q '"savedApis":\[\]'
          docker run --rm api-qa-intelligence api-qa --version | grep -q "$(cat VERSION)"
      - name: Show the logs
        if: failure()
        run: docker logs api-qa
