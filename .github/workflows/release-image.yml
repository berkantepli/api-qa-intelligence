name: Publish Docker image

# A pushed version tag (for example v1.0.0) publishes the image to GitHub Container Registry as
# ghcr.io/<owner>/api-qa-intelligence:<version> and :latest.
on:
  push:
    tags: ["v*"]
  # A manual run publishes the current main branch as :latest only.
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: Build and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/api-qa-intelligence
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=API QA Intelligence
            org.opencontainers.image.description=Turn an OpenAPI contract into risk-aware QA checks, run them, and explain failures.
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
